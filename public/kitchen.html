<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kendis Kitchen — Kitchen Display</title>
<style>
:root{--green:#153d2b;--gold:#d5a928;--bg:#eef1ed;--red:#b42318;--orange:#a85d00;--line:#dfe5df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17211c;font-family:Arial,Helvetica,sans-serif}.hidden{display:none!important}
header{height:82px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 24px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px}.logo{width:56px;height:56px;border-radius:50%;object-fit:contain}.brand h1{margin:0;color:var(--gold);font-size:23px}.brand p{margin:2px 0 0;color:var(--green);font-size:10px;letter-spacing:3px;font-weight:900}.header-actions{display:flex;align-items:center;gap:10px}.clock{font-weight:900;color:var(--green);font-size:14px}.btn{border:1px solid #c9d0cb;background:#fff;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.login{max-width:420px;margin:80px auto;background:#fff;padding:30px;border-radius:16px;border:1px solid var(--line)}.login h2{margin:0 0 8px;color:var(--green)}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #cbd1cd;border-radius:9px}.error{background:#fff0ef;color:var(--red);padding:10px;border-radius:8px;font-size:13px;margin:10px 0}.login button{width:100%;padding:12px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:900}
main{padding:18px;max-width:1800px;margin:auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}.bar h2{margin:0;color:var(--green);font-size:27px}.subtitle{font-size:12px;color:#69736d;margin-top:3px}.filters{display:flex;gap:8px;align-items:center}.filters button.active{background:var(--green);color:#fff;border-color:var(--green)}.count{display:inline-block;margin-left:5px;min-width:22px;padding:2px 6px;border-radius:99px;background:#edf4ee;text-align:center}.active .count{background:#fff;color:var(--green)}
.alert{background:#fff4df;border:1px solid #efd49e;color:#704700;padding:11px 14px;border-radius:10px;margin-bottom:14px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:14px}.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;min-height:250px;display:flex;flex-direction:column;box-shadow:0 2px 6px rgba(0,0,0,.04)}.card.overdue{border-color:#e3aaa5}.card.today{border-color:#d5a928}.card.ready{border-color:#a9c9b0}.card-head{display:flex;justify-content:space-between;gap:12px}.order-no{font-size:23px;font-weight:1000;color:var(--green)}.customer{font-size:17px;font-weight:900;margin-top:4px}.pickup{font-size:15px;font-weight:900;color:var(--green);margin-top:8px}.badge{padding:6px 9px;border-radius:99px;font-size:11px;font-weight:1000;background:#edf4ee;color:var(--green);height:max-content}.badge.overdue{background:#ffe9e6;color:var(--red)}.badge.today{background:#fff5d7;color:#7a5900}.items{margin:13px 0;font-size:16px;line-height:1.55;flex:1}.item-row{display:flex;gap:8px}.qty{font-weight:1000;color:var(--green);min-width:34px}.notes{background:#faf7ed;border-radius:9px;padding:9px;font-size:13px;margin-bottom:12px}.notes strong{display:block;margin-bottom:2px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.actions button{padding:11px 7px;border-radius:9px;border:1px solid #cbd1cd;background:#fff;font-weight:1000;cursor:pointer}.actions button.primary{background:var(--green);color:#fff;border-color:var(--green)}.actions button.warn{background:#fff2df;border-color:#e4c58d;color:#744600}.actions button.ready{background:#eaf5eb;border-color:#a9c9b0;color:var(--green)}.empty{background:#fff;border:1px dashed #c8d0ca;border-radius:14px;padding:50px;text-align:center;color:#6a746e;font-weight:800;grid-column:1/-1}.status-line{font-size:12px;color:#6a746e;margin-top:8px}.toast{position:fixed;right:18px;bottom:18px;background:var(--green);color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;box-shadow:0 4px 15px rgba(0,0,0,.2);z-index:20}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(280px,1fr))}}@media(max-width:700px){header{height:auto;padding:10px 14px}.clock{display:none}main{padding:12px}.bar{align-items:flex-start;flex-direction:column}.filters{width:100%;overflow:auto}.grid{grid-template-columns:1fr}.card{min-height:230px}}
</style>
</head>
<body>
<header><div class="brand"><img class="logo" src="https://raw.githubusercontent.com/KENDISKITCHEN/kendis-kitchen-ordering/main/Kendis-Kitchen-logo.webp.png" alt="Kendis Kitchen"><div><h1>Kendis Kitchen</h1><p>KITCHEN DISPLAY</p></div></div><div class="header-actions"><span id="clock" class="clock"></span><button id="soundBtn" class="btn">🔔 Sound Off</button><button id="refreshBtn" class="btn">↻ Refresh</button><button id="logout" class="btn">Log out</button></div></header>
<div id="login" class="login hidden"><h2>Kitchen Login</h2><p>Sign in to open the kitchen display.</p><div id="loginError" class="error hidden"></div><div class="field"><label>Admin Password</label><input id="password" type="password"></div><button id="loginBtn">Open Kitchen Display</button></div>
<main id="app" class="hidden"><div class="bar"><div><h2>Kitchen Display</h2><div class="subtitle">Active paid orders — oldest/most urgent pickup first. Auto-refreshes every 30 seconds.</div></div><div class="filters"><button class="btn active" data-filter="ACTIVE">Active <span class="count" id="activeCount">0</span></button><button class="btn" data-filter="NEW">New <span class="count" id="newCount">0</span></button><button class="btn" data-filter="PREPARING">Preparing <span class="count" id="prepCount">0</span></button><button class="btn" data-filter="READY">Ready <span class="count" id="readyCount">0</span></button></div></div><div id="alert" class="alert hidden"></div><section id="grid" class="grid"></section></main><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),money=n=>Number(n||0).toFixed(2);let orders=[],filter='ACTIVE',sound=false,lastSignature='';
function pickupDate(o){const raw=String(o.pickup||'').trim(),m=raw.match(/^(\d{4}-\d{2}-\d{2})(?:\s+at\s+|[ T])(\d{1,2}:\d{2})?/i);if(!m)return null;const d=new Date(`${m[1]}T${m[2]||'00:00'}`);return Number.isNaN(d.getTime())?null:d}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function pickupKey(o){const d=pickupDate(o);return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''};function active(o){return !['COMPLETED','CANCELLED','UNPAID'].includes(o.status)};function overdue(o){const d=pickupDate(o);return Boolean(d&&d.getTime()<Date.now()&&active(o))};function today(o){return pickupKey(o)===todayKey()&&active(o)}
function rank(o){if(overdue(o))return 0;if(o.status==='PREPARING')return 1;if(o.status==='READY')return 2;if(o.status==='CONFIRMED')return 3;return 4};function sorted(a){return [...a].sort((x,y)=>{const r=rank(x)-rank(y);if(r)return r;const xd=pickupDate(x)?.getTime()??Infinity,yd=pickupDate(y)?.getTime()??Infinity;return xd-yd})}
function playBeep(){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(e){}}
async function session(){return (await fetch('/api/admin/session',{cache:'no-store'})).json()};function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()};
async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),d=await r.json();if(!r.ok){$('loginError').textContent=d.error||'Login failed.';$('loginError').classList.remove('hidden');return}showApp()}
async function load(){try{const r=await fetch('/api/admin/orders',{cache:'no-store'});if(r.status===401){location.reload();return}const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load orders.');const next=d.orders||[];const sig=next.map(o=>`${o.id}:${o.status}`).join('|');if(lastSignature&&sig!==lastSignature)playBeep();lastSignature=sig;orders=next;render()}catch(e){$('grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function render(){const activeOrders=orders.filter(active),overdueOrders=activeOrders.filter(overdue),todayOrders=activeOrders.filter(today);$('activeCount').textContent=activeOrders.length;$('newCount').textContent=orders.filter(o=>o.status==='NEW').length;$('prepCount').textContent=orders.filter(o=>o.status==='PREPARING').length;$('readyCount').textContent=orders.filter(o=>o.status==='READY').length;if(overdueOrders.length){$('alert').classList.remove('hidden');$('alert').textContent=`⚠ ${overdueOrders.length} active order${overdueOrders.length===1?' is':'s are'} past the scheduled pickup time.`}else if(todayOrders.length){$('alert').classList.remove('hidden');$('alert').textContent=`Today: ${todayOrders.length} active pickup${todayOrders.length===1?'':'s'} scheduled.`}else $('alert').classList.add('hidden');let list=activeOrders;if(filter==='NEW')list=orders.filter(o=>o.status==='NEW');if(filter==='PREPARING')list=orders.filter(o=>o.status==='PREPARING');if(filter==='READY')list=orders.filter(o=>o.status==='READY');list=sorted(list);if(!list.length){$('grid').innerHTML='<div class="empty">No orders in this view.</div>';return}$('grid').innerHTML=list.map(card).join('');$('grid').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>changeStatus(b.dataset.id,b.dataset.next,b))}
function card(o){const od=overdue(o),td=today(o),next=o.status==='NEW'?'CONFIRMED':o.status==='CONFIRMED'?'PREPARING':o.status==='PREPARING'?'READY':'COMPLETED';const buttonText=o.status==='NEW'?'CONFIRM ORDER':o.status==='CONFIRMED'?'START PREPARING':o.status==='PREPARING'?'MARK READY':'MARK COMPLETED';const cls=od?'overdue':o.status==='READY'?'ready':td?'today':'';return `<article class="card ${cls}"><div class="card-head"><div><div class="order-no">#${esc(o.invoiceNumber||'—')}</div><div class="customer">${esc(o.customer?.name||'Customer')}</div><div class="pickup">${esc(o.pickup||'Pickup not specified')}</div></div><div><span class="badge">${esc(o.status)}</span>${od?'<div class="badge overdue" style="margin-top:5px">OVERDUE</div>':td?'<div class="badge today" style="margin-top:5px">TODAY</div>':''}</div></div><div class="items">${(o.items||[]).map(i=>`<div class="item-row"><span class="qty">${esc(i.quantity)}×</span><span>${esc(i.name)}</span></div>`).join('')||'No items listed'}</div>${o.notes?`<div class="notes"><strong>Customer Notes</strong>${esc(o.notes)}</div>`:''}<div class="actions"><button class="primary" data-id="${esc(o.id)}" data-next="${next}">${buttonText}</button>${o.status!=='READY'?'<button data-id="'+esc(o.id)+'" data-next="CANCELLED">CANCEL ORDER</button>':'<button class="ready" data-id="'+esc(o.id)+'" data-next="COMPLETED">COMPLETE ORDER</button>'}</div><div class="status-line">Paid $${money(o.amountPaid)} • Order total $${money(o.total)}</div></article>`}
async function changeStatus(id,status,b){b.disabled=true;try{const r=await fetch('/api/admin/orders/'+encodeURIComponent(id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not update order.');showToast(`Order updated to ${status}`);await load()}catch(e){alert(e.message)}finally{b.disabled=false}}
function showToast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('refreshBtn').onclick=load;$('logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()};$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔔 Sound On':'🔔 Sound Off';if(sound)playBeep()};document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});setInterval(()=>{if(!$('app').classList.contains('hidden'))load()},30000);setInterval(()=>{$('clock').textContent=new Date().toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})},1000);(async()=>{try{const s=await session();if(s.authenticated)showApp();else{$('login').classList.remove('hidden')}}catch(e){$('login').classList.remove('hidden')}})();
</script>
</body></html>
