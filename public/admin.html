<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kendis Kitchen — Order Management</title>
<style>
:root{--green:#153d2b;--gold:#d5a928;--bg:#f6f7f4;--line:#e8e1d2;--muted:#68706b;--danger:#9b2020;--warn:#8a5710}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#202020}button,input,select{font:inherit}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:50%;object-fit:contain}.brand h1{margin:0;color:var(--gold);font-size:25px}.brand p{margin:2px 0 0;color:var(--green);font-size:10px;letter-spacing:3px;font-weight:700}
.wrap{max-width:1450px;margin:auto;padding:24px}.hidden{display:none}.login{max-width:430px;margin:80px auto;background:#fff;padding:30px;border:1px solid var(--line);border-radius:16px}.login h2{color:var(--green);margin-top:0}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;background:#fff}.primary{width:100%;background:var(--green);color:#fff;border:0;border-radius:9px;padding:12px;font-weight:800;cursor:pointer}.error{background:#fff0f0;color:var(--danger);padding:10px;border-radius:9px;margin:10px 0;font-size:13px}.logout,.refresh{border:1px solid #ccc;background:#fff;border-radius:9px;padding:9px 13px;font-weight:800;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}.top h2{margin:0;color:var(--green);font-size:28px}.sub,.meta{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}.stat,.order,.toolbar,.empty,.alert{background:#fff;border:1px solid var(--line);border-radius:13px}.stat{padding:15px}.stat b{display:block;font-size:25px;color:var(--green)}.stat span{color:var(--muted);font-size:11px;font-weight:800}.stat.alert-stat b{color:var(--green)}
.alert{padding:11px 14px;margin-bottom:15px;background:#fff8e8;border-color:#ead7a4;color:#6f5111;font-size:13px}.alert strong{color:#5f4206}
.toolbar{padding:13px;margin-bottom:15px;display:grid;grid-template-columns:1fr 190px 190px;gap:10px}.orders{display:grid;gap:12px}.order{padding:16px}.order.priority{border-left:5px solid var(--gold)}.order.overdue{border-left:5px solid var(--danger)}.order-head{display:flex;justify-content:space-between;gap:15px}.order-title{font-size:18px;font-weight:900;color:var(--green)}.customer{font-weight:800;margin-top:4px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#eef5ec;color:var(--green)}.badge.unpaid{background:#fff1df;color:var(--warn)}.badge.cancelled{background:#ffecec;color:var(--danger)}.badge.overdue{background:#ffecec;color:var(--danger);margin-left:5px}.amount{font-size:21px;font-weight:900;color:var(--green);text-align:right}.details{display:grid;grid-template-columns:1.2fr 1fr 220px;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid #eee;font-size:13px}.items{line-height:1.65}.notes{background:#faf8f0;border-radius:9px;padding:9px;margin-top:8px}.pickup-time{font-weight:800;color:var(--green)}.links{text-align:right;margin-top:9px}.links a{color:var(--green);font-weight:800;text-decoration:none;font-size:12px}.empty{padding:35px;text-align:center;color:var(--muted)}.status-disabled{padding:11px;border:1px solid #ddd;border-radius:9px;background:#f7f7f7;color:var(--muted);font-weight:700}
@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.details{grid-template-columns:1fr}.amount{text-align:left}.top{flex-direction:column;align-items:flex-start}}@media(max-width:520px){header{padding:10px 14px}.wrap{padding:14px}.cards{grid-template-columns:1fr 1fr}.order-head{flex-direction:column}.amount{text-align:left}.brand h1{font-size:20px}}
</style>
</head>
<body>
<header><div class="brand"><img class="logo" src="https://raw.githubusercontent.com/KENDISKITCHEN/kendis-kitchen-ordering/main/Kendis-Kitchen-logo.webp.png" alt="Kendis Kitchen"><div><h1>Kendis Kitchen</h1><p>ORDER MANAGEMENT</p></div></div><button id="logout" class="logout hidden">Log out</button></header>
<div id="login" class="login"><h2>Admin Login</h2><p class="sub">Sign in to manage Kendis Kitchen orders.</p><div id="loginError" class="error hidden"></div><div class="field"><label>Admin Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary">Sign In</button></div>
<main id="app" class="wrap hidden">
  <div class="top"><div><h2>Order Management</h2><div class="sub">Paid orders from Wave, with preparation status.</div></div><button id="refresh" class="refresh">↻ Refresh</button></div>
  <div class="cards">
    <div class="stat"><b id="newCount">0</b><span>NEW</span></div>
    <div class="stat"><b id="confirmedCount">0</b><span>CONFIRMED</span></div>
    <div class="stat"><b id="prepCount">0</b><span>PREPARING</span></div>
    <div class="stat"><b id="readyCount">0</b><span>READY</span></div>
    <div class="stat"><b id="todayCount">0</b><span>TODAY'S PICKUPS</span></div>
    <div class="stat alert-stat"><b id="salesTotal">$0.00</b><span>PAID ORDER TOTAL</span></div>
  </div>
  <div id="pickupAlert" class="alert hidden"></div>
  <div class="toolbar"><input id="search" placeholder="Search customer, invoice, or item..."><select id="statusFilter"><option value="ALL">All statuses</option><option>NEW</option><option>CONFIRMED</option><option>PREPARING</option><option>READY</option><option>COMPLETED</option><option>CANCELLED</option><option>UNPAID</option></select><select id="dateFilter"><option value="ALL">All dates</option><option value="TODAY">Today's pickups</option><option value="UPCOMING">Upcoming pickup</option></select></div>
  <div id="orders" class="orders"></div>
</main>
<script>
const $=id=>document.getElementById(id),money=n=>Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let orders=[];
const statuses=['NEW','CONFIRMED','PREPARING','READY','COMPLETED','CANCELLED'];
const allStatuses=[...statuses,'UNPAID'];
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function pickupDate(o){const raw=String(o.pickup||'').trim();const m=raw.match(/^(\d{4}-\d{2}-\d{2})(?:\s+at\s+|[ T])(\d{1,2}:\d{2})?/i);if(!m)return null;const d=new Date(`${m[1]}T${m[2]||'00:00'}`);return Number.isNaN(d.getTime())?null:d}
function pickupKey(o){const d=pickupDate(o);return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''}
function isActive(o){return !['COMPLETED','CANCELLED'].includes(o.status)}
function isOverdue(o){const d=pickupDate(o);return Boolean(d&&d.getTime()<Date.now()&&isActive(o))}
function isTodayPickup(o){return pickupKey(o)===todayKey()&&isActive(o)}
function priorityRank(o){if(o.status==='READY')return 0;if(o.status==='PREPARING')return 1;if(o.status==='CONFIRMED')return 2;if(o.status==='NEW')return 3;if(o.status==='UNPAID')return 4;return 5}
function sortOrders(list){return [...list].sort((a,b)=>{const ao=isOverdue(a),bo=isOverdue(b);if(ao!==bo)return ao?-1:1;const ar=priorityRank(a),br=priorityRank(b);if(ar!==br)return ar-br;const ad=pickupDate(a)?.getTime()??Infinity,bd=pickupDate(b)?.getTime()??Infinity;if(ad!==bd)return ad-bd;return new Date(b.createdAt||0)-new Date(a.createdAt||0)})}
async function getSession(){return (await fetch('/api/admin/session',{cache:'no-store'})).json()}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');loadOrders()}
async function login(){const password=$('password').value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const d=await r.json();if(!r.ok){$('loginError').textContent=d.error||'Login failed.';$('loginError').classList.remove('hidden');return}showApp()}
async function loadOrders(){$('orders').innerHTML='<div class="empty">Loading orders...</div>';try{const r=await fetch('/api/admin/orders',{cache:'no-store'});const d=await r.json();if(r.status===401){location.reload();return}if(!r.ok)throw Error(d.error||'Could not load orders.');orders=d.orders||[];render()}catch(e){$('orders').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function matches(o){const q=$('search').value.trim().toLowerCase(),st=$('statusFilter').value,df=$('dateFilter').value;const hay=[o.invoiceNumber,o.customer?.name,o.customer?.email,o.pickup,o.notes,...(o.items||[]).map(i=>i.name)].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(st!=='ALL'&&o.status!==st)return false;if(df==='TODAY'&&!isTodayPickup(o))return false;if(df==='UPCOMING'){const d=pickupDate(o);if(!d||d.getTime()<Date.now()||!isActive(o))return false}return true}
function render(){const paid=orders.filter(o=>o.amountPaid>=o.total&&o.total>0),visible=sortOrders(orders.filter(matches));$('newCount').textContent=orders.filter(o=>o.status==='NEW').length;$('confirmedCount').textContent=orders.filter(o=>o.status==='CONFIRMED').length;$('prepCount').textContent=orders.filter(o=>o.status==='PREPARING').length;$('readyCount').textContent=orders.filter(o=>o.status==='READY').length;$('todayCount').textContent=orders.filter(isTodayPickup).length;$('salesTotal').textContent='$'+money(paid.reduce((s,o)=>s+o.amountPaid,0));const overdue=orders.filter(isOverdue),today=orders.filter(isTodayPickup);if(overdue.length){$('pickupAlert').classList.remove('hidden');$('pickupAlert').innerHTML='<strong>Pickup attention:</strong> '+overdue.length+' active order'+(overdue.length===1?' is':'s are')+' past the scheduled pickup time.'+(today.length?' '+today.length+' active pickup'+(today.length===1?' is':'s are')+' scheduled for today.':'')}else if(today.length){$('pickupAlert').classList.remove('hidden');$('pickupAlert').innerHTML='<strong>Today:</strong> '+today.length+' active pickup'+(today.length===1?' is':'s are')+' scheduled for today.'}else $('pickupAlert').classList.add('hidden');if(!visible.length){$('orders').innerHTML='<div class="empty">No orders match your filters.</div>';return}$('orders').innerHTML=visible.map(o=>{const overdueFlag=isOverdue(o),todayFlag=isTodayPickup(o),statusControl=o.status==='UNPAID'?'<div class="status-disabled">Awaiting payment</div>':'<select data-id="'+esc(o.id)+'">'+allStatuses.map(s=>'<option value="'+s+'" '+(s===o.status?'selected':'')+(s==='UNPAID'?' disabled':'')+'>'+s+'</option>').join('')+'</select>';return '<article class="order '+(overdueFlag?'overdue ':((todayFlag&&isActive(o))?'priority':'')+'')+'"><div class="order-head"><div><div class="order-title">Order #'+esc(o.invoiceNumber||'—')+'</div><div class="customer">'+esc(o.customer?.name||'Customer')+'</div><div class="meta">'+esc(o.customer?.email||'')+(o.customer?.mobile||o.customer?.phone?' • '+esc(o.customer.mobile||o.customer.phone):'')+'</div><div class="meta">Created '+esc(new Date(o.createdAt).toLocaleString())+'</div></div><div><span class="badge '+(o.status==='UNPAID'?'unpaid':o.status==='CANCELLED'?'cancelled':'')+'">'+esc(o.status)+'</span>'+(overdueFlag?'<span class="badge overdue">OVERDUE</span>':'')+'<div class="amount">$'+money(o.total)+'</div><div class="meta">Paid $'+money(o.amountPaid)+(o.amountDue>0?' • Due $'+money(o.amountDue):'')+'</div></div></div><div class="details"><div class="items"><strong>Items</strong><br>'+((o.items||[]).map(i=>esc(i.quantity)+' × '+esc(i.name)+' — $'+money(i.subtotal||i.price*i.quantity)).join('<br>')||'No items listed')+'</div><div><strong>Pickup</strong><br><span class="pickup-time">'+esc(o.pickup||'Not specified')+'</span>'+(o.notes?'<div class="notes"><strong>Notes</strong><br>'+esc(o.notes)+'</div>':'')+'</div><div><strong>Order Status</strong>'+statusControl+'<div class="links"><a href="'+esc(o.invoiceUrl)+'" target="_blank" rel="noopener">Open Wave invoice ↗</a></div></div></div></article>'}).join('');$('orders').querySelectorAll('select[data-id]').forEach(s=>s.addEventListener('change',()=>updateStatus(s.dataset.id,s.value,s)))}
async function updateStatus(id,status,select){const previous=orders.find(x=>x.id===id)?.status;select.disabled=true;try{const r=await fetch('/api/admin/orders/'+encodeURIComponent(id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});const d=await r.json();if(!r.ok)throw Error(d.error||'Update failed.');const o=orders.find(x=>x.id===id);if(o)o.status=status;render()}catch(e){alert(e.message);if(previous)select.value=previous;select.disabled=false}}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('refresh').onclick=loadOrders;$('search').oninput=render;$('statusFilter').onchange=render;$('dateFilter').onchange=render;$('logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()};
(async()=>{try{const s=await getSession();if(s.authenticated)showApp();else if(!s.configured){$('loginError').textContent='Admin access is not configured yet. Add ADMIN_PASSWORD in Render Environment.';$('loginError').classList.remove('hidden')}}catch(e){}})();
</script>
</body>
</html>
