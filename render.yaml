services:
  - type: web
    name: kendis-kitchen-ordering
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/menu
    envVars:
      - key: WAVE_ACCESS_TOKEN
        sync: false
      - key: WAVE_BUSINESS_ID
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: WAVE_INCOME_ACCOUNT_ID
        sync: false
