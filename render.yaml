services:
  - type: web
    name: kendis-kitchen-ordering
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/menu
    envVars:
      - key: WAVE_ACCESS_TOKEN
        sync: false
      - key: WAVE_BUSINESS_ID
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: WAVE_INCOME_ACCOUNT_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
